<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project</title>
    <link rel="stylesheet" href="style.css">
    <!-- I chose GSAP as my library as i feel it makes such a large difference in the user experience. It makes the website
     feel more alive and less static. It can inform the users choices and decisions, and allows for a greater understanding of
     statuses. It also makes it more fun!-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/CustomWiggle.min.js"></script>

</head>
<body>
  <body>
    <div class="container">
        <header class="header">
            <img class="blathers" src="img/blathers.png" alt="blathers">
            <div class="headerText">
                <img class="logo" src="img/Animal_Crossing_Logo.png" alt="animal_crossing_logo">
                <div class="subtitle">Wildlife Guide</div>
            </div>
            
        </header>

        <div class="positioning">
            <nav class="view-selector">
                <button class="view-button active" id="btn-fish" data-view="fish">Fish</button>
                <button class="view-button" id="btn-bugs" data-view="bugs">Bugs</button>
                <button class="view-button" id="btn-creatures" data-view="creatures">Sea<br>Creatures</button>
                
            </nav>
        </div>

        <main class="display-container">
            <div id="data-display">
                <div class="loading">Loading restaurant data...</div>
            </div>
        </main>

        
    </div>
    <script type="module" src="./script.js" defer></script>
</body>
</html>
