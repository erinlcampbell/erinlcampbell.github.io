<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project</title>
    <link rel="stylesheet" href="style.css">
    <!-- I chose GSAP as my library as i feel it makes such a large difference in the user experience. It makes the website
     feel more alive and less static. It can inform the users choices and decisions, and allows for a greater understanding of
     statuses. It also makes it more fun!-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/CustomWiggle.min.js"></script>

</head>
<body>
  <body>
    <div class="container">
        <header>
            <h1>Final Project</h1>
            <h2>Animal Crossing Wildlife Guide</h2>
        </header>

        <nav class="view-selector">
            <button class="view-button active" id="btn-fish" data-view="fish"></button>
            <button class="view-button" id="btn-bugs" data-view="bugs"></button>
            <button class="view-button" id="btn-creatures" data-view="creatures"></button>
            
        </nav>

        <main class="display-container">
            <div id="data-display">
                <div class="loading">Loading restaurant data...</div>
            </div>
        </main>

        
    </div>
    <script type="module" src="./script.js" defer></script>
</body>
</html>
